name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-and-shared:
    name: Mobile and Shared Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run workspace build scripts
        run: npm run build

  phoenix-test:
    name: Phoenix API Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adventure_time_phoenix_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adventure_time_phoenix_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/phoenix

    env:
      MIX_ENV: test
      PHX_TEST_DB_NAME: adventure_time_phoenix_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            apps/phoenix/_build
            apps/phoenix/deps
            ~/.mix
            ~/.hex
          key: ${{ runner.os }}-mix-${{ hashFiles('apps/phoenix/mix.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('apps/phoenix/mix.lock') }}-

      - name: Install Phoenix dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Phoenix validation suite
        run: mix test
