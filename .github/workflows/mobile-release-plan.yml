name: Mobile Release Plan

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to prepare
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      ref:
        description: Git ref or SHA to analyze
        required: false
        default: main

permissions:
  contents: read

jobs:
  plan:
    name: Prepare Mobile Release Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run release validation gates
        run: npm run typecheck

      - name: Generate release plan
        run: node ./scripts/prepare-mobile-release.mjs --platform "${{ github.event.inputs.platform }}" --ref HEAD --output-dir .release

      - name: Publish release plan summary
        run: cat .release/mobile-release-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-plan-${{ github.run_id }}
          path: .release/
