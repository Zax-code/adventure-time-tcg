name: Deploy Phoenix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-phoenix.yml"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "apps/phoenix/**"
      - "apps/web/**"
      - "packages/api-client/**"
      - "packages/contracts/**"
      - "packages/game-engine/**"
      - "packages/theme/**"
      - "infra/**"
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: Skip database migrations
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: production-phoenix
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and Publish Phoenix Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/zax-code/adventure-time-tcg-api
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Phoenix image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/phoenix/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Capture immutable image reference
        id: image
        run: echo "image_ref=${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-image
    environment:
      name: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '2222' }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      TAILSCALE_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ vars.TS_OAUTH_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to Tailscale with OAuth
        if: ${{ env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Connect to Tailscale with auth key
        if: ${{ env.TAILSCALE_OAUTH_CLIENT_ID == '' && env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Configure restricted deployment key
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" >~/.ssh/adventure-time-tcg-deploy
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/adventure-time-tcg-deploy ~/.ssh/known_hosts

      - name: Preflight production host resolution
        run: |
          set -euo pipefail

          if getent ahosts "$PRODUCTION_HOST" >/dev/null 2>&1; then
            echo "Resolved production host: $PRODUCTION_HOST"
            exit 0
          fi

          echo "Unable to resolve PRODUCTION_HOST=$PRODUCTION_HOST from the GitHub runner." >&2

          if [ -n "$TAILSCALE_OAUTH_CLIENT_ID" ] || [ -n "$TAILSCALE_AUTHKEY" ]; then
            echo "Tailscale credentials are configured, but the host still does not resolve." >&2
            echo "Use the full MagicDNS hostname or a Tailscale IP for PRODUCTION_HOST." >&2
          else
            echo "If the production host is tailnet-only, configure TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET or TS_AUTHKEY in the production environment." >&2
          fi

          exit 1

      - name: Verify host deployment protocol
        run: |
          set -euo pipefail
          protocol=$(ssh -T \
            -i ~/.ssh/adventure-time-tcg-deploy \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" protocol </dev/null)
          test "$protocol" = 1

      - name: Authenticate production host to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -T \
            -i ~/.ssh/adventure-time-tcg-deploy \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
            "registry-login $GITHUB_ACTOR"

      - name: Run production deploy
        env:
          DEPLOY_REF: ${{ github.sha }}
          IMAGE_REF: ${{ needs.build-image.outputs.image_ref }}
          SKIP_MIGRATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_migrate || 'false' }}
        run: |
          [[ $DEPLOY_REF =~ ^[0-9a-f]{40}$ ]]
          ssh -T \
            -i ~/.ssh/adventure-time-tcg-deploy \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
            "deploy $DEPLOY_REF $IMAGE_REF $SKIP_MIGRATE"

      - name: Verify public deployment
        run: |
          ssh -T \
            -i ~/.ssh/adventure-time-tcg-deploy \
            -p "$PRODUCTION_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" public-health >/dev/null
