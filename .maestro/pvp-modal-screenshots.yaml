appId: love.leaetzak.adventuretime
name: PvP modal focused screenshots
tags:
  - pvp
  - screenshots
  - modals
onFlowStart:
  - setOrientation: PORTRAIT
onFlowComplete:
  - setOrientation: PORTRAIT
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Aaction&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- waitForAnimationToEnd
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Aaction&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pvp-battle-board
    timeout: 30000
- runFlow: subflows/rotate-to-pvp-board.yaml
- extendedWaitUntil:
    visible:
      id: pvp-action-modal
    timeout: 5000
- assertVisible:
    id: pvp-action-modal
- takeScreenshot: tmp-pvp-modal-shots/01-action-modal
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Amy-card-info&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-card-info-modal
- takeScreenshot: tmp-pvp-modal-shots/02-card-info-my-active
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Aopponent-card-info&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-card-info-modal
- takeScreenshot: tmp-pvp-modal-shots/03-card-info-opponent-active
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Alog&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pvp-combat-log-modal
    timeout: 5000
- takeScreenshot: tmp-pvp-modal-shots/04-combat-log-modal
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Aend-turn&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-end-turn-confirm-modal
- takeScreenshot: tmp-pvp-modal-shots/05-end-turn-confirm
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}%3A%3Ae2e%3A%3Aconcede&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-concede-confirm-modal
- takeScreenshot: tmp-pvp-modal-shots/06-concede-confirm
- setOrientation: PORTRAIT
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp%3Ffixture%3D${TEST_MATCH_ID}&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pvp-lobby-hero
    timeout: 30000
- scrollUntilVisible:
    element:
      id: pvp-primary-action-card
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: pvp-primary-action-card
- assertVisible:
    id: pvp-invite-sheet
- takeScreenshot: tmp-pvp-modal-shots/07-invite-sheet
- tapOn:
    id: pvp-invite-sheet-cancel-button
- waitForAnimationToEnd
- assertNotVisible:
    id: pvp-invite-sheet
