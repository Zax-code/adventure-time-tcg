appId: love.leaetzak.adventuretime
name: Collection ownership filters
tags:
  - collection
  - filters
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fcollection&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: collection-ownership-filter-all
- assertVisible:
    id: collection-card-tile-0
# ensure-mobile-test-user.sh grants every catalog card to the test user, so
# "Owned" lists cards and "Not owned" is the empty state.
- tapOn:
    id: collection-ownership-filter-owned
- assertVisible:
    id: collection-card-tile-0
- tapOn:
    id: collection-ownership-filter-not-owned
- assertVisible: No cards match your filters.
