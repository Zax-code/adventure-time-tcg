appId: love.leaetzak.adventuretime
name: Speed Calculus training keypad accepts rapid input
tags:
  - smoke
  - quests
  - speed-calculus
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests%2Fspeed-calculus%2Ftraining&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    text: Training mode
- tapOn:
    text: Start training run
- assertVisible:
    id: speed-calculus-key-1
- assertVisible:
    id: speed-calculus-key-submit
- takeScreenshot: tmp-speed-calculus-shots/00-keypad-visible
- extendedWaitUntil:
    visible:
      id: speed-calculus-question-active
    timeout: 10000
- assertVisible:
    id: speed-calculus-question-label-1
- takeScreenshot: tmp-speed-calculus-shots/00-question-visible
- tapOn:
    id: speed-calculus-key-1
- tapOn:
    id: speed-calculus-key-2
- tapOn:
    id: speed-calculus-key-3
- takeScreenshot: tmp-speed-calculus-shots/01-answer-123
- assertVisible:
    id: speed-calculus-answer-value-123
- tapOn:
    id: speed-calculus-key-clear
- tapOn:
    id: speed-calculus-key-4
- tapOn:
    id: speed-calculus-key-5
- tapOn:
    id: speed-calculus-key-delete
- takeScreenshot: tmp-speed-calculus-shots/02-answer-4
- assertVisible:
    id: speed-calculus-answer-value-4
