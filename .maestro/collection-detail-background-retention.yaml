appId: love.leaetzak.adventuretime
name: Collection remains mounted through card detail
tags:
  - collection
  - regression
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fcollection&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: collection-card-tile-0
    timeout: 15000
- takeScreenshot: tmp-collection-retention-shots/00-before-detail
- tapOn:
    id: collection-card-tile-0
- assertVisible:
    id: collection-card-detail-sheet
- takeScreenshot: tmp-collection-retention-shots/01-detail-open
- swipe:
    start: "50%,14%"
    end: "50%,92%"
    duration: 1200
- extendedWaitUntil:
    notVisible:
      id: collection-card-detail-sheet
    timeout: 10000
- assertVisible:
    id: collection-card-tile-0
- waitForAnimationToEnd
- takeScreenshot: tmp-collection-retention-shots/02-after-detail
