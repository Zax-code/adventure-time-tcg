appId: love.leaetzak.adventuretime
name: Daily Numbers smoke
tags:
  - smoke
  - quests
  - daily-numbers
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests%2Fdaily-numbers%3Fmode%3D1-5&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    text: Daily Numbers
- assertVisible:
    id: daily-numbers-mode-1-5
- assertVisible:
    id: daily-numbers-tile-n0
- assertVisible:
    id: daily-numbers-tile-n1
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/09-final-live-board
- tapOn:
    id: daily-numbers-mode-2-4
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/12-board-selector-2-4
- tapOn:
    id: daily-numbers-mode-1-5
- waitForAnimationToEnd
- tapOn:
    id: daily-numbers-operator-plus
- tapOn:
    id: daily-numbers-operator-plus
- tapOn:
    id: daily-numbers-operator-plus
- tapOn:
    id: daily-numbers-tile-n0
- tapOn:
    id: daily-numbers-tile-n1
- assertVisible:
    id: daily-numbers-apply-step
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/10-clickable-result
- tapOn:
    id: daily-numbers-apply-step
- waitForAnimationToEnd
- assertVisible:
    id: daily-numbers-tile-r0
- takeScreenshot: tmp-daily-numbers-archive-shots/11-derived-result
- scrollUntilVisible:
    element:
      id: daily-numbers-undo
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: daily-numbers-undo
- assertVisible:
    id: daily-numbers-reset
- scrollUntilVisible:
    element:
      id: daily-numbers-submit
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: daily-numbers-submit
