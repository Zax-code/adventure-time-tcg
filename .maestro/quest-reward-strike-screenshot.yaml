appId: love.leaetzak.adventuretime
name: Quest step card screenshot
tags:
  - quests
  - screenshots
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: quests-progress-summary
- scrollUntilVisible:
    element:
      id: quests-card-steps_10k
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: tmp-quest-reward-strike/step-card
