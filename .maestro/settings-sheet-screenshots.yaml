appId: love.leaetzak.adventuretime
name: Settings sheet focused screenshots
tags:
  - settings
  - screenshots
---
- launchApp:
    clearState: true
    clearKeychain: true
- scrollUntilVisible:
    element:
      id: auth-email-input
    direction: DOWN
    timeout: 40000
    centerElement: true
- assertVisible:
    id: auth-email-input
- tapOn:
    id: auth-email-input
- eraseText
- inputText: ${TEST_EMAIL}
- pressKey: Enter
- assertVisible:
    id: auth-password-input
- tapOn:
    id: auth-password-input
- eraseText
- inputText: ${TEST_PASSWORD}
- pressKey: Enter
- assertVisible:
    id: tab-home
- tapOn:
    id: app-header-settings-button
- assertVisible:
    id: settings-profile-edit
- takeScreenshot: tmp-settings-shots/01-profile
- scrollUntilVisible:
    element:
      id: settings-step-source-device_health
    direction: DOWN
    timeout: 40000
    centerElement: true
- takeScreenshot: tmp-settings-shots/02-step-source
- scrollUntilVisible:
    element:
      id: settings-step-sync-action
    direction: DOWN
    timeout: 40000
    centerElement: true
- takeScreenshot: tmp-settings-shots/03-step-sync
- scrollUntilVisible:
    element:
      id: settings-logout-action
    direction: DOWN
    timeout: 40000
    centerElement: true
- takeScreenshot: tmp-settings-shots/04-session
