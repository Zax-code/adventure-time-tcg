appId: love.leaetzak.adventuretime
name: Daily Numbers archive screenshots
tags:
  - quests
  - daily-numbers
  - archive
  - screenshots
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests%2Fdaily-numbers-history&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      text: Daily Numbers Archive
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/01-history

- tapOn:
    id: daily-numbers-archive-mode-1-5
- extendedWaitUntil:
    visible:
      text: Daily Numbers Archive
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/02-archive-board

- tapOn:
    id: daily-numbers-tile-n0
- tapOn:
    id: daily-numbers-tile-n1
- scrollUntilVisible:
    element:
      id: daily-numbers-operator-plus
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: daily-numbers-operator-plus
- tapOn:
    id: daily-numbers-apply-step
- tapOn:
    id: daily-numbers-submit
- extendedWaitUntil:
    visible:
      text: Save this archive result?
    timeout: 15000
- tapOn:
    point: "70%,58%"
- scrollUntilVisible:
    element:
      id: daily-numbers-share-result
    direction: DOWN
    timeout: 20000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/03-archive-result

- tapOn:
    id: daily-numbers-share-result
- extendedWaitUntil:
    visible:
      text: ".*Image.*"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/04-share-sheet
- tapOn:
    point: "39%,88%"
- waitForAnimationToEnd
- launchApp:
    appId: com.apple.mobileslideshow
- waitForAnimationToEnd
- takeScreenshot: tmp-daily-numbers-archive-shots/05-photos
