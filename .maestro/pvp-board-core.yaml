appId: love.leaetzak.adventuretime
name: Adventure Time PvP board core smoke
tags:
  - smoke
  - pvp
  - board
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-match%3Fid%3D${TEST_MATCH_ID}&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pvp-battle-board
    timeout: 30000
- waitForAnimationToEnd
- longPressOn:
    id: pvp-my-unit-0
- assertVisible:
    id: pvp-card-info-modal
- tapOn:
    id: pvp-card-info-modal-close-button
    retryTapIfNoChange: true
- waitForAnimationToEnd
- assertNotVisible:
    id: pvp-card-info-modal
- tapOn:
    id: pvp-action-end-turn-button
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-end-turn-confirm-modal
- tapOn:
    id: pvp-end-turn-confirm-button
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-battle-board
