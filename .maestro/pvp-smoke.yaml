appId: love.leaetzak.adventuretime
name: Adventure Time PvP battle smoke
tags:
  - smoke
  - pvp
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time://e2e-auth?redirect=%2Fpvp&fixture=${TEST_MATCH_ID}&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-open-mechanics-button
- assertVisible:
    id: pvp-active-match-card-0
- tapOn:
    id: pvp-active-match-card-0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pvp-battle-board
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: Tap a card for actions
    timeout: 5000
- tapOn:
    id: pvp-battle-board
    point: "88%,14%"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pvp-combat-log-modal
    timeout: 5000
- tapOn:
    id: pvp-combat-log-close-button
- assertNotVisible:
    id: pvp-combat-log-modal
- longPressOn:
    id: pvp-my-unit-0
- assertVisible:
    id: pvp-card-info-modal
- tapOn:
    id: pvp-card-info-close-button
- assertNotVisible:
    id: pvp-card-info-modal
- tapOn:
    id: pvp-my-unit-0
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-action-modal
- assertVisible:
    id: pvp-action-basic-button
- tapOn:
    id: pvp-action-basic-button
    retryTapIfNoChange: true
- tapOn:
    id: pvp-opponent-unit-0
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-battle-board
- tapOn:
    id: pvp-action-end-turn-button
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-end-turn-confirm-sheet
- tapOn:
    id: pvp-end-turn-confirm-button
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-battle-board
- tapOn:
    id: pvp-battle-board
    point: "12%,14%"
    retryTapIfNoChange: true
- assertVisible:
    id: pvp-open-mechanics-button
