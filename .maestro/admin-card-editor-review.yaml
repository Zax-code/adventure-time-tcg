appId: love.leaetzak.adventuretime
name: Admin card editor review screenshots
tags:
  - admin
  - cards
  - screenshots
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fadmin-card-editor%3Fmode%3Dcreate&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible: "Create new card"
- waitForAnimationToEnd
- takeScreenshot: tmp-card-editor-shots/01-overview
- swipe:
    start: "50%,80%"
    end: "50%,42%"
    duration: 700
- waitForAnimationToEnd
- takeScreenshot: tmp-card-editor-shots/02-middle-sections
- swipe:
    start: "50%,82%"
    end: "50%,26%"
    duration: 800
- waitForAnimationToEnd
- takeScreenshot: tmp-card-editor-shots/03-lower-sections
