appId: love.leaetzak.adventuretime
name: View inventory screenshots
tags:
  - screenshots
  - view-inventory
---
# Captures every routed mobile view for docs/design/view-inventory.pen.
# Needs an admin TEST_EMAIL plus -e VIEW_CARD_ID (owned card), VIEW_ABILITY_ID, VIEW_PROFILE_ID (another player).
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: auth-email-input
    timeout: 40000
- takeScreenshot: tmp-view-inventory-shots/entry-login
- runFlow: subflows/login.yaml
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 01-tab-home
      VIEW_LINK: adventure-time:///
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 02-tab-packs
      VIEW_LINK: adventure-time:///packs
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 03-tab-quests
      VIEW_LINK: adventure-time:///quests
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 04-tab-pvp
      VIEW_LINK: adventure-time:///pvp
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 05-tab-rankings
      VIEW_LINK: adventure-time:///rankings
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 06-tab-collection
      VIEW_LINK: adventure-time:///collection
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 07-tab-gifts
      VIEW_LINK: adventure-time:///gifts
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 08-quest-daily-numbers-play
      VIEW_LINK: adventure-time:///quests/daily-numbers-play?mode=2-4
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 09-quest-daily-numbers-history
      VIEW_LINK: adventure-time:///quests/daily-numbers-history
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 10-quest-perfect-timing
      VIEW_LINK: adventure-time:///quests/perfect-timing
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 11-quest-speed-calculus
      VIEW_LINK: adventure-time:///quests/speed-calculus
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 12-quest-speed-calculus-training
      VIEW_LINK: adventure-time:///quests/speed-calculus/training
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 13-quest-wordle
      VIEW_LINK: adventure-time:///quests/wordle
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 14-pvp-match
      VIEW_LINK: adventure-time:///pvp-match?id=${TEST_MATCH_ID}
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 15-pvp-replay
      VIEW_LINK: adventure-time:///pvp-replay?id=${TEST_REPLAY_ID}
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 16-pvp-loadouts
      VIEW_LINK: adventure-time:///pvp-loadouts
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 17-pvp-history
      VIEW_LINK: adventure-time:///pvp-history
- runFlow:
    file: subflows/capture-view.yaml
    env:
      VIEW_NAME: 18-pvp-spectate
      VIEW_LINK: adventure-time:///pvp-spectate
- runFlow:
