appId: love.leaetzak.adventuretime
name: PvP loadout editor focused screenshots
tags:
  - pvp
  - loadouts
  - screenshots
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp-loadouts%3Ffixture%3D${TEST_MATCH_ID}&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-loadout-summary-card
- takeScreenshot: tmp-loadout-editor-shots/01-create-top
- tapOn:
    text: "E2E PvP Fast Loadout"
- waitForAnimationToEnd
- takeScreenshot: tmp-loadout-editor-shots/02-edit-top
- scrollUntilVisible:
    element:
      id: pvp-loadout-collection
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: tmp-loadout-editor-shots/03-editor-overview
