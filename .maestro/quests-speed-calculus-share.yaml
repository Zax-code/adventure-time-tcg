appId: love.leaetzak.adventuretime
name: Quest recap shares Speed Calculus runs
tags:
  - quests
  - sharing
  - speed-calculus
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: quests-progress-summary
    timeout: 15000
- assertVisible:
    id: quests-share-results
- tapOn:
    id: quests-share-results
- assertVisible:
    id: quests-recap-sheet
- assertVisible:
    id: quests-share-speed-calculus
- tapOn:
    id: quests-share-speed-calculus
- extendedWaitUntil:
    visible: "Copy"
    timeout: 15000
