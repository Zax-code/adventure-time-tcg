appId: love.leaetzak.adventuretime
name: Adventure Time mobile smoke
tags:
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- assertVisible:
    id: pvp-open-mechanics-button
- tapOn:
    id: tab-gifts
- assertVisible:
    id: gifts-filter-all
- tapOn:
    id: gifts-filter-all
- tapOn:
    id: gifts-filter-sent
- tapOn:
    id: gifts-filter-received
- tapOn:
    id: tab-pvp
- assertVisible:
    id: pvp-open-mechanics-button
- tapOn:
    id: pvp-open-mechanics-button
- assertVisible:
    id: pvp-mechanics-screen
- swipe:
    start: "50%,10%"
    end: "50%,88%"
    duration: 700
- waitForAnimationToEnd
- assertVisible:
    id: pvp-open-reference-button
- tapOn:
    id: pvp-open-reference-button
- assertVisible:
    id: pvp-reference-screen
- swipe:
    start: "50%,10%"
    end: "50%,88%"
    duration: 700
- waitForAnimationToEnd
- openLink:
    link: adventure-time:///settings
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: settings-language-en
