appId: love.leaetzak.adventuretime
name: Pack odds remain available when purchase is unaffordable
tags:
  - packs
  - regression
---
- runFlow:
    file: subflows/pack-odds-storefront.yaml
    env:
      TEST_EMAIL: ${TEST_EMAIL}
      TEST_PASSWORD: ${TEST_PASSWORD}
- scrollUntilVisible:
    element:
      id: pack-card-basic-pack
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible:
    id: pack-card-basic-pack
    enabled: false
- scrollUntilVisible:
    element:
      id: pack-odds-button-basic-pack
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: pack-odds-button-basic-pack
- extendedWaitUntil:
    visible:
      id: pack-odds-sheet
    timeout: 10000
- assertVisible:
    id: pack-odds-distribution
- swipe:
    start: 50%, 10%
    end: 50%, 85%
    duration: 700
- extendedWaitUntil:
    notVisible:
      id: pack-odds-sheet
    timeout: 10000
- assertVisible:
    id: pack-storefront
