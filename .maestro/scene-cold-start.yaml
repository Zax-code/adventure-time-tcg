appId: love.leaetzak.adventuretime
name: Scene lifecycle cold-start deep link
tags:
  - smoke
  - lifecycle
  - auth
---
- launchApp:
    clearState: true
    clearKeychain: true
- stopApp
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp&accessToken=${TEST_ACCESS_TOKEN}&refreshToken=${TEST_REFRESH_TOKEN}&user=${TEST_USER}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pvp-open-mechanics-button
    timeout: 30000
