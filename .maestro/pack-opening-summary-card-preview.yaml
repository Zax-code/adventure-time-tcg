appId: love.leaetzak.adventuretime
name: Pack opening summary card preview
tags:
  - packs
  - smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpacks&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: pack-storefront
    timeout: 10000
- tapOn:
    id: pack-card-legendary-pack
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pack-opening-ready
    timeout: 10000
- tapOn:
    id: pack-opening-ready
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pack-opening-reveal
    timeout: 10000
- tapOn:
    id: pack-opening-reveal
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: pack-opening-reveal
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: pack-opening-reveal
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: pack-opening-reveal
    retryTapIfNoChange: true
- waitForAnimationToEnd
- tapOn:
    id: pack-opening-reveal
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pack-opening-summary
    timeout: 10000
- tapOn:
    id: pack-summary-card-all-0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: pack-summary-card-preview-sheet
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: pack-summary-card-preview-stats
    timeout: 5000
- tapOn:
    id: pack-summary-card-preview-close
    retryTapIfNoChange: true
- assertNotVisible:
    id: pack-summary-card-preview-sheet
