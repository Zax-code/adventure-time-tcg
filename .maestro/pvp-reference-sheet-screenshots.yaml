appId: love.leaetzak.adventuretime
name: PvP reference sheet focused screenshots
tags:
  - pvp
  - screenshots
  - reference
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fpvp%3Ffixture%3D${TEST_MATCH_ID}&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- assertVisible:
    id: pvp-lobby-hero
- tapOn:
    id: pvp-open-reference-button
- assertVisible:
    id: pvp-reference-overview-card
- takeScreenshot: tmp-pvp-shots/04-reference-overview
