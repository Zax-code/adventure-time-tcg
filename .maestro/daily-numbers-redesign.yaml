appId: love.leaetzak.adventuretime
name: Daily Numbers redesigned board behavior
tags:
  - quests
  - daily-numbers
  - redesign
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink:
    link: adventure-time:///e2e-auth?redirect=%2Fquests%2Fdaily-numbers-play%3Fmode%3D3-3&email=${TEST_EMAIL_URI}&password=${TEST_PASSWORD_URI}
- runFlow: subflows/confirm-open-link-if-needed.yaml
- extendedWaitUntil:
    visible:
      id: daily-numbers-mode-3-3
    timeout: 15000
- assertVisible:
    text: Daily Numbers
- assertVisible:
    id: daily-numbers-mode-3-3
- takeScreenshot: tmp-daily-numbers-redesign-shots/01-fresh-board

# Three-large / three-small mode always gives us one operand from 1-10 and one
# from 25/50/75/100, so subtraction and division are impossible in this order.
- tapOn:
    text: "Number tile (?:[1-9]|10)"
- tapOn:
    text: "Number tile (?:25|50|75|100)"
- assertVisible:
    id: daily-numbers-operator-minus
    enabled: false
- assertVisible:
    id: daily-numbers-operator-divide
    enabled: false
- assertVisible:
    id: daily-numbers-operator-plus
    enabled: true
- assertVisible:
    id: daily-numbers-operator-multiply
    enabled: true
- takeScreenshot: tmp-daily-numbers-redesign-shots/02-impossible-operators

- tapOn:
    id: daily-numbers-operator-plus
- scrollUntilVisible:
    element:
      id: daily-numbers-apply-step
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: daily-numbers-apply-step
- scrollUntilVisible:
    element:
      id: daily-numbers-tile-r0
    direction: UP
    timeout: 10000
    centerElement: true
- assertVisible:
    id: daily-numbers-tile-r0
- takeScreenshot: tmp-daily-numbers-redesign-shots/03-derived-number

- scrollUntilVisible:
    element:
      id: daily-numbers-undo
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: daily-numbers-undo
- scrollUntilVisible:
    element:
      id: daily-numbers-tile-n0
    direction: UP
    timeout: 10000
    centerElement: true
- assertVisible:
    id: daily-numbers-tile-n0
- assertVisible:
    id: daily-numbers-tile-n5

- tapOn:
    id: daily-numbers-tile-n0
- tapOn:
    id: daily-numbers-tile-n1
- tapOn:
    id: daily-numbers-operator-plus
- scrollUntilVisible:
    element:
      id: daily-numbers-apply-step
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: daily-numbers-apply-step
- scrollUntilVisible:
    element:
      id: daily-numbers-reset
    direction: DOWN
    timeout: 10000
    centerElement: true
- tapOn:
    id: daily-numbers-reset
- scrollUntilVisible:
    element:
      id: daily-numbers-tile-n0
    direction: UP
    timeout: 10000
    centerElement: true
- assertVisible:
    id: daily-numbers-tile-n0
- assertVisible:
    id: daily-numbers-tile-n5
- takeScreenshot: tmp-daily-numbers-redesign-shots/04-reset-board
